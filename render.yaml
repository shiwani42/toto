# Render Blueprint for Toto.
# Pick "New" → "Blueprint" in the Render dashboard and choose this repo;
# the dashboard reads this file and pre-fills the service config.
#
# Idle keep-alive (Supabase Free ~7-day pause): this static site cannot run
# cron. Use an external uptime monitor (e.g. UptimeRobot) against:
#   1) https://toto-4xfl.onrender.com/
#   2) https://<PROJECT_REF>.supabase.co/auth/v1/health
# Interval ≤ 5 days (daily is fine). See HANDOFF.md §4 item 7.

services:
  - type: web
    name: toto
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      # Optional cloud features. Set these in the Render UI; they are not
      # committed to the repo. The app runs local-only when they're empty.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ANTHROPIC_API_KEY
        sync: false

    # SPA fallback: any unknown path serves /index.html, so query-string
    # routes like /?screen=map keep working on direct loads.
    # Existing files in dist/ (sw.js, manifest, icons, assets) are served
    # first — the rewrite only applies when no static file matches.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Sensible cache headers for the hashed Vite assets.
    # Keep the service worker and webmanifest fresh so updates propagate.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
