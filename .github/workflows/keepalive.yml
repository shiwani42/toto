# Keep Supabase Free from pausing after ~7 idle days, and nudge the
# Render static site so cold paths stay warm.
#
# Runs twice a week (safer than exactly every 7 days). Also runnable
# by hand: Actions → Keepalive → Run workflow.
#
# Secrets are optional. If SUPABASE_URL / SUPABASE_ANON_KEY are unset,
# the job reads the public publishable config from the live app bundle
# (same values already shipped to the browser).
#
# Optional repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — same value as VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY  — same value as VITE_SUPABASE_ANON_KEY
#   APP_URL            — defaults to https://toto-4xfl.onrender.com

name: Keepalive

on:
  schedule:
    # 09:00 UTC Monday and Thursday → gap stays under 7 days
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          url="${APP_URL:-https://toto-4xfl.onrender.com}"
          url="${url%/}"

          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$url/" || true)
            echo "Render attempt $attempt: HTTP $code ($url)"
            case "$code" in
              2*|3*) exit 0 ;;
            esac
            sleep 5
          done

          echo "Render did not return a success status."
          exit 1

      - name: Ping Supabase
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          app="${APP_URL:-https://toto-4xfl.onrender.com}"
          app="${app%/}"
          base="${SUPABASE_URL:-}"
          key="${SUPABASE_ANON_KEY:-}"

          if [ -z "$base" ] || [ -z "$key" ]; then
            echo "Secrets unset; reading public Supabase config from $app"
            for attempt in 1 2 3; do
              html=$(curl -sS --max-time 45 "$app/" || true)
              js_path=$(printf '%s' "$html" | grep -oE '/assets/index-[^"]+\.js' | head -1 || true)
              if [ -n "$js_path" ]; then
                bundle=$(curl -sS --max-time 45 "$app$js_path" || true)
                if [ -z "$base" ]; then
                  base=$(printf '%s' "$bundle" | grep -oE 'https://[a-z0-9-]+\.supabase\.co' | head -1 || true)
                fi
                if [ -z "$key" ]; then
                  key=$(printf '%s' "$bundle" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -1 || true)
                fi
                if [ -z "$key" ]; then
                  key=$(printf '%s' "$bundle" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -1 || true)
                fi
              fi
              if [ -n "$base" ] && [ -n "$key" ]; then
                break
              fi
              echo "Config scrape attempt $attempt did not resolve URL/key; retrying..."
              sleep 5
            done
          fi

          if [ -z "$base" ]; then
            echo "Could not resolve Supabase URL."
            exit 1
          fi
          base="${base%/}"

          if [ -n "$key" ]; then
            path="/auth/v1/health"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/sb-keepalive.out -w "%{http_code}" --max-time 45 \
                -H "apikey: ${key}" \
                -H "Authorization: Bearer ${key}" \
                -H "Accept: application/json" \
                "${base}${path}" || true)
              echo "Supabase attempt $attempt: HTTP $code (${base}${path})"
              case "$code" in
                2*) exit 0 ;;
              esac
              sleep 5
            done
          else
            path="/rest/v1/"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/sb-keepalive.out -w "%{http_code}" --max-time 45 \
                -H "Accept: application/json" \
                "${base}${path}" || true)
              echo "Supabase attempt $attempt: HTTP $code (${base}${path})"
              case "$code" in
                2*|401|403|404|406) exit 0 ;;
              esac
              sleep 5
            done
          fi

          echo "Supabase did not respond as expected."
          exit 1

      - name: Summary
        run: |
          echo "Keepalive OK: Render app and Supabase both answered."
