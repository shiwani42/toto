# Keep Supabase Free from pausing after ~7 idle days, and nudge the
# Render static site so cold paths stay warm.
#
# Runs twice a week (safer than exactly every 7 days). Also runnable
# by hand: Actions → Keepalive → Run workflow.
#
# Secrets are optional. If SUPABASE_URL / SUPABASE_ANON_KEY are unset,
# the job reads the public publishable config from the live app bundle
# (same values already shipped to the browser).
#
# Optional repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — same value as VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY  — same value as VITE_SUPABASE_ANON_KEY
#   APP_URL            — defaults to https://toto-4xfl.onrender.com

name: Keepalive

on:
  schedule:
    # 09:00 UTC Monday and Thursday → gap stays under 7 days
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          url="${APP_URL:-https://toto-4xfl.onrender.com}"
          url="${url%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url/")
          echo "Render HTTP $code ($url)"
          case "$code" in
            2*|3*) ;;
            *) echo "Unexpected status from app URL"; exit 1 ;;
          esac

      - name: Ping Supabase REST
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          app="${APP_URL:-https://toto-4xfl.onrender.com}"
          app="${app%/}"
          base="${SUPABASE_URL:-}"
          key="${SUPABASE_ANON_KEY:-}"

          if [ -z "$base" ] || [ -z "$key" ]; then
            echo "Secrets unset; reading public Supabase config from $app"
            html=$(curl -sS --max-time 30 "$app/")
            js_path=$(printf '%s' "$html" | grep -oE '/assets/index-[^"]+\.js' | head -1)
            if [ -z "$js_path" ]; then
              echo "Could not find the app JS bundle."
              exit 1
            fi
            bundle=$(curl -sS --max-time 30 "$app$js_path")
            if [ -z "$base" ]; then
              base=$(printf '%s' "$bundle" | grep -oE 'https://[a-z0-9-]+\.supabase\.co' | head -1)
            fi
            if [ -z "$key" ]; then
              key=$(printf '%s' "$bundle" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -1)
            fi
            if [ -z "$key" ]; then
              key=$(printf '%s' "$bundle" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -1)
            fi
          fi

          if [ -z "$base" ]; then
            echo "Could not resolve Supabase URL."
            exit 1
          fi
          base="${base%/}"

          if [ -n "$key" ]; then
            path="/rest/v1/shops?select=id&limit=1"
            code=$(curl -sS -o /tmp/sb-keepalive.out -w "%{http_code}" --max-time 30 \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              -H "Accept: application/json" \
              "${base}${path}")
          else
            path="/rest/v1/"
            code=$(curl -sS -o /tmp/sb-keepalive.out -w "%{http_code}" --max-time 30 \
              -H "Accept: application/json" \
              "${base}${path}")
          fi

          echo "Supabase REST HTTP $code (${base}${path})"
          # 2xx = query landed. 401/403/404/406 still prove the project answered.
          case "$code" in
            2*|401|403|404|406) ;;
            *)
              echo "Supabase did not respond as expected (HTTP $code)."
              exit 1
              ;;
          esac
